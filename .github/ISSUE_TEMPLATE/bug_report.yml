name: Bug 报告
description: 排盘结果、面板界面、解读流式、工具调用或安装出问题时使用
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索已有 issue，并确认用的是最新发布版或 `main` 分支。

        **请勿粘贴真实生辰、姓名、住址、经度等可识别信息**；复现请用黄金用例
        `1992-05-03 09:30 男 经度 105.97`，或自造数据。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 发生了什么？影响是什么（不能排盘 / 界面卡住 / 结果不对 / 装不上）？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 侧栏打开「紫微斗数 Pro」
        2. 输入 1992-05-03 09:30 男 经度 105.97
        3. 点击「排盘」
        4. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
      description: 如果涉及排盘结果，请写出具体字段（农历、五行局、命宫、主星、四化……）的前后差异
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 受影响范围
      options:
        - 排盘结果（日期 / 时辰 / 星曜 / 四化 / 大限）
        - 面板界面（布局 / 交互 / 主题 / 窗口 chrome）
        - 解读与报告（流式输出 / 收尾 / 导出）
        - 工具调用（ziwei_paipan / ziwei_check / ziwei_templates / ziwei_context）
        - 安装 / 加载 / 重启后不生效
        - 其他
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 运行 `dsh --version` 得到
      placeholder: 0.2.1-rc.5
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      placeholder: v24.20.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 自检输出 / 日志（可选）
      description: 可粘贴 `node verify/all.mjs` 的失败段或相关报错。请先自行脱敏，不要附带真实用户数据。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过 issue，确认不是重复问题
          required: true
        - label: 我已移除真实个人生辰、姓名等敏感信息
          required: true
        - label: 我使用的是最新发布版或 main 分支，并已尝试重启 DSH
          required: true
