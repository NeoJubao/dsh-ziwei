<div id="app" data-view="home" class="busy">
  <div class="shell">
    <main class="stage">
      <canvas id="sky" aria-hidden="true"></canvas>
      <header class="head" id="head"></header>
      <section class="home" id="home">
        <div id="planets"></div>
        <div class="reticle" id="reticle"></div>
        <div class="col">
          <p class="date-line" id="dateLine"></p>
          <h1 class="status" id="status"></h1>
          <div class="receipts" id="receipts"></div>
          <form class="ask" id="askForm" autocomplete="off">
            <input id="ask" type="text" aria-label="对紫微师说">
            <button class="send" id="askSend" type="submit" aria-label="发送">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
            </button>
          </form>
          <p class="hint" id="hint"></p>
          <div class="chips" id="chips"></div>
        </div>
        <p class="gesture" id="gesture">拖动旋转 · 滚轮缩放 · 点星球打开命盘</p>
      </section>
      <section class="chart" id="chart" hidden></section>
    </main>
    <aside class="assistant" id="assistant" aria-label="紫微师">
      <header class="as-head">
        <b>紫微师</b><small id="asSub"></small>
        <button class="icon-btn" type="button" id="asClose" aria-label="收起紫微师">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
      <div class="suggest" id="suggest"></div>
      <div class="quote" id="quote" hidden></div>
      <form class="as-form" id="asForm">
        <textarea id="asInput" rows="1" placeholder="想问什么，直接说" aria-label="问紫微师"></textarea>
        <button class="send" type="submit" aria-label="发送">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <div class="as-foot">传统文化解读，仅供参考，不构成专业建议</div>
    </aside>
  </div>
  <div class="proto" role="group" aria-label="原型开关">
    <span>原型</span>
    <button type="button" data-scene="new">新用户</button>
    <button type="button" data-scene="returning">老用户</button>
    <i></i>
    <button type="button" data-theme-set="light">浅色</button>
    <button type="button" data-theme-set="dark">深色</button>
    <i></i>
    <button type="button" id="replay">重播开场</button>
  </div>
  <div class="xprev" id="xprev" role="dialog" aria-modal="true" aria-label="下载的报告文件预览" hidden>
    <div class="xbar">
      <b id="xname"></b>
      <span>下载报告得到的就是这个文件，可以直接打印成 PDF。原型里只能预览。</span>
      <button class="btn" type="button" id="xclose">关闭预览</button>
    </div>
    <div class="xhost" id="xhost"></div>
  </div>
  <div class="toast" id="toast" hidden></div>
</div>
